<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animedoro Pro</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="brand">
          <span class="brand-title">Animedoro Pro</span>
          <span class="brand-subtitle">Estação</span>
        </div>
        <div class="header-actions">
          <button class="icon-button" id="settings-open" title="Configurações">
            ⚙️
          </button>
        </div>
      </header>

      <main class="main-grid">
        <section class="panel timer-panel">
          <div class="tab-row">
            <div class="tabs" id="tabs"></div>
            <button class="add-tab" id="add-tab" title="Nova aba">
              +
            </button>
          </div>

          <div class="timer-body">
            <div class="timer-circle" id="timer-circle">
              <div class="timer-value" id="timer-value">50:00</div>
              <div class="timer-edit">Clique para editar</div>
            </div>
            <div class="timer-controls">
              <button class="step-button" data-adjust="-5">-5</button>
              <button class="primary" id="start-pause">Começar</button>
              <button class="secondary" id="reset">Reset</button>
              <button class="step-button" data-adjust="5">+5</button>
            </div>
            <div class="timer-meta" id="timer-meta"></div>
          </div>
        </section>

        <section class="panel diary-panel">
          <div class="diary-header">
            <div class="diary-title">
              <span>Diário</span>
            </div>
            <div class="diary-controls">
              <button class="icon-button" id="open-calendar" title="Calendário">
                📅
              </button>
              <div class="diary-date" id="current-date"></div>
            </div>
          </div>

          <div class="week-tabs" id="week-tabs"></div>

          <div class="history-grid" id="history"></div>

          <div class="stats">
            <div class="stat-row">
              <div>
                <span class="stat-label">Episódios</span>
                <span class="stat-value" id="stat-episodes">0</span>
              </div>
              <div>
                <span class="stat-label">Tempo de anime</span>
                <span class="stat-value" id="stat-anime-time">0h 0m</span>
              </div>
              <div>
                <span class="stat-label">Tempo de estudo</span>
                <span class="stat-value" id="stat-study-time">0h 0m</span>
              </div>
            </div>
            <div class="stat-row">
              <div>
                <span class="stat-label">Streak</span>
                <span class="stat-value" id="stat-streak">0 dias</span>
              </div>
              <div>
                <span class="stat-label">Foco total</span>
                <span class="stat-value" id="stat-total">0h 0m</span>
              </div>
            </div>
          </div>

          <div class="cards" id="cards"></div>
        </section>
      </main>
    </div>

    <div class="modal" id="modal">
      <div class="modal-content">
        <h3>Criar nova aba</h3>
        <p>Nome do novo timer:</p>
        <input type="text" id="new-tab-name" placeholder="Ex: Redação" />
        <div class="modal-actions">
          <button class="secondary" id="cancel-modal">Cancelar</button>
          <button class="primary" id="save-modal">Salvar</button>
        </div>
      </div>
    </div>

    <div class="modal" id="calendar-modal">
      <div class="modal-content calendar-content">
        <h3>Escolha o mês</h3>
        <div class="month-grid" id="month-grid"></div>
        <div class="modal-actions">
          <button class="secondary" id="close-calendar">Fechar</button>
        </div>
      </div>
    </div>

    <div class="modal" id="settings-modal">
      <div class="modal-content settings-content">
        <div class="settings-header">
          <h3>Ajustes visuais</h3>
          <button class="icon-button" id="settings-close" title="Fechar">✕</button>
        </div>
        <div class="settings-section">
          <span class="settings-title">Modo de aparência</span>
          <div class="segmented-control">
            <button class="segment" id="theme-light">☀️ Claro</button>
            <button class="segment" id="theme-dark">🌙 Escuro</button>
          </div>
        </div>
        <div class="settings-section">
          <span class="settings-title">Papel de fundo</span>
          <label class="file-button">
            Escolher imagem
            <input type="file" id="wallpaper-input" accept="image/*" hidden />
          </label>
          <button class="secondary" id="wallpaper-remove">Remover</button>
        </div>
        <div class="settings-section">
          <span class="settings-title">Som do timer</span>
          <label class="file-button">
            Escolher áudio
            <input type="file" id="sound-input" accept="audio/*" hidden />
          </label>
          <button class="secondary" id="sound-remove">Remover</button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
